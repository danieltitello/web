<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Track miles and points across your loyalty programs.">
	<title>Miles - Loyalty Balance Tracker</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>
<body>
	<header class="app-header">
		<div class="brand">
			<span class="brand-mark" aria-hidden="true">M</span>
			<span>Miles</span>
		</div>
		<button class="primary-button" id="open-program-dialog" type="button">
			<span aria-hidden="true">+</span>
			Add program
		</button>
	</header>

	<main>
		<section class="summary" aria-labelledby="summary-title">
			<div>
				<p class="eyebrow">Your portfolio</p>
				<h1 id="summary-title">Miles overview</h1>
			</div>
			<div class="total-card">
				<span>Total miles</span>
				<strong id="total-miles">0</strong>
				<small id="program-count">0 programs</small>
			</div>
		</section>

		<section class="programs-section" aria-labelledby="programs-title">
			<div class="section-heading">
				<h2 id="programs-title">My programs</h2>
				<label class="search-field">
					<span class="sr-only">Search programs</span>
					<input id="program-search" type="search" placeholder="Search programs">
				</label>
			</div>

			<div id="program-grid" class="program-grid" aria-live="polite"></div>

			<div id="empty-state" class="empty-state" hidden>
				<div class="empty-icon" aria-hidden="true">✈</div>
				<h3>No programs yet</h3>
				<p>Add your first loyalty program to start tracking your miles.</p>
				<button class="primary-button" id="empty-add-button" type="button">Add program</button>
			</div>
		</section>
	</main>

	<dialog id="program-dialog">
		<form id="program-form" method="dialog">
			<div class="dialog-heading">
				<div>
					<p class="eyebrow">Loyalty account</p>
					<h2 id="dialog-title">Add program</h2>
				</div>
				<button class="icon-button" id="close-dialog" type="button" aria-label="Close dialog">×</button>
			</div>

			<input id="program-id" type="hidden">

			<label>
				<span>Program name</span>
				<input id="program-name" name="name" type="text" placeholder="e.g. United MileagePlus" required maxlength="60">
			</label>

			<label>
				<span>Miles</span>
				<input id="program-miles" name="miles" type="text" inputmode="numeric" placeholder="e.g. 45,000" required>
			</label>

			<label>
				<span>Membership number <small>(optional)</small></span>
				<input id="program-membership" name="membership" type="text" placeholder="Account or membership number" maxlength="40">
			</label>

			<div class="dialog-actions">
				<button class="secondary-button" id="cancel-dialog" type="button">Cancel</button>
				<button class="primary-button" type="submit" id="save-program">Save program</button>
			</div>
		</form>
	</dialog>

	<dialog id="delete-dialog">
		<form method="dialog" id="delete-form">
			<h2>Remove program?</h2>
			<p id="delete-message">This will remove the program from Miles.</p>
			<div class="dialog-actions">
				<button class="secondary-button" id="cancel-delete" type="button">Cancel</button>
				<button class="danger-button" type="submit">Remove</button>
			</div>
		</form>
	</dialog>

	<template id="program-template">
		<article class="program-card">
			<div class="program-card-header">
				<div class="program-logo" aria-hidden="true"></div>
				<div class="card-actions">
					<button class="icon-button edit-button" type="button" aria-label="Edit program">Edit</button>
					<button class="icon-button delete-button" type="button" aria-label="Remove program">×</button>
				</div>
			</div>
			<h3 class="program-name"></h3>
			<p class="membership"></p>
			<div class="balance">
				<strong></strong>
				<span>miles</span>
			</div>
			<p class="updated"></p>
		</article>
	</template>
</body>
</html>
